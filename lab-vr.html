<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="assets/three.min.js"><\/script>')</script>
<script>
(function(){
'use strict';
if (!window.THREE){ document.getElementById('msg').classList.add('on'); return; }

/* ============================================================
   FÍSICA (a mesma do simulador de grãos)
   Alcance: NIST ESTAR, água líquida, CSDA (referência).
   Densidade a granel do trigo: SUPOSIÇÃO (0,78 g/cm³).
   Forma da curva de dose em profundidade: ILUSTRATIVA.
   ============================================================ */
const RHO = 0.78;
const CSDA = [[0.5,0.1766],[0.55,0.2013],[0.6,0.2265],[0.7,0.2778],[0.8,0.3302],[0.9,0.3832],[1,0.4367],
  [1.25,0.5717],[1.5,0.7075],[1.75,0.8432],[2,0.9785],[2.5,1.247],[3,1.514],[3.5,1.777],
  [4,2.037],[4.5,2.295],[5,2.550],[5.5,2.802],[6,3.052],[7,3.545],[8,4.030],[9,4.506],[10,4.975]];
function csda(E){
  if (E <= CSDA[0][0]) return CSDA[0][1] * E / CSDA[0][0];
  for (let i = 1; i < CSDA.length; i++) if (E <= CSDA[i][0]){
    const [a,b] = CSDA[i-1], [c,d] = CSDA[i]; return b + (d - b) * (E - a) / (c - a);
  }
  return CSDA[CSDA.length - 1][1];
}
const rangeCm = E => csda(E) / RHO;
function rel(z, E){
  const R = rangeCm(E);
  if (z < 0 || z >= R) return 0;
  const x = z / R, xm = 0.3, pk = 1.35;
  return x <= xm ? 1 + (pk - 1) * Math.sin(Math.PI / 2 * x / xm)
                 : pk * Math.pow(Math.cos(Math.PI / 2 * (x - xm) / (1 - xm)), 1.3);
}
const doseAt = (z, T, E, sides, Ds) => Ds * (rel(z, E) + (sides === 2 ? rel(T - z, E) : 0));
function stats(T, E, sides, Ds){
  let mn = Infinity, mx = 0;
  for (let i = 0; i <= 160; i++){ const d = doseAt(T * i / 160, T, E, sides, Ds); if (d < mn) mn = d; if (d > mx) mx = d; }
  return { mn, mx, dur: mn > 1e-9 ? mx / mn : null };
}

/* Paleta viridis (a mesma do simulador de grãos) */
const STOPS = [[0,[68,1,84]],[.125,[72,40,120]],[.25,[62,73,137]],[.375,[49,104,142]],[.5,[38,130,142]],[.625,[31,158,137]],[.75,[53,183,121]],[.875,[110,206,88]],[1,[253,231,37]]];
function pal(t){
  t = Math.min(Math.max(t, 0), 1);
  for (let i = 1; i < STOPS.length; i++) if (t <= STOPS[i][0]){
    const [t0,c0] = STOPS[i-1], [t1,c1] = STOPS[i], u = (t - t0) / (t1 - t0);
    return c0.map((v,k) => (v + (c1[k] - v) * u) / 255);
  }
  return STOPS[STOPS.length-1][1].map(v => v / 255);
}
const nf1 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
const f1 = x => nf1.format(x), f2 = x => nf2.format(x);

/* ============================================================
   FASES (metas e doses por fase são do JOGO, não de norma)
   ============================================================ */
const LEVELS = [
  { nome: 'Cobrir o lote',      T: 4,  Ds: 100, alvo: 60, durMax: 2.5, texto: 'Um lote de 4 cm de grãos. Todo grão precisa receber ao menos 60 Gy, e a dose não pode ficar muito desigual.' },
  { nome: 'O lote grosso',      T: 8,  Ds: 100, alvo: 60, durMax: 2.5, texto: 'Agora são 8 cm. O elétron tem alcance limitado: será que um lado só dá conta?' },
  { nome: 'No limite do feixe', T: 10, Ds: 100, alvo: 60, durMax: 2.5, texto: 'O lote tem 10 cm, quase o limite do acelerador. Cada MeV importa.' },
  { nome: 'Modo livre',         T: 6,  Ds: 100, alvo: 60, durMax: 2.5, free: true, texto: 'Sem metas. Mude energia, lados e espessura e observe onde os insetos sobrevivem.' }
];
LEVELS.forEach(L => {                       // menor "gasto de energia" (MeV × lados) que cumpre a fase
  if (L.free) return;
  let best = Infinity;
  for (let E = 1; E <= 10; E++) for (const s of [1, 2]){
    const st = stats(L.T, E, s, L.Ds);
    if (st.mn >= L.alvo && st.dur <= L.durMax) best = Math.min(best, E * s);
  }
  L.best = best;
});

/* ============================================================
   ESTADO
   ============================================================ */
const S = { lvl: 0, E: 5, sides: 1, T: LEVELS[0].T, phase: 'ready', p: 0, result: null, stars: -1, msg: '' };
const DUR_RUN = 2.8;                        // duração da animação (s)
const lvl = () => LEVELS[S.lvl];

/* ============================================================
   CENA
   ============================================================ */
const cv = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); }
catch (e){ document.getElementById('msg').classList.add('on'); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.xr.enabled = true;
try { renderer.xr.setReferenceSpaceType('local-floor'); } catch (e){}
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0f1d);
scene.fog = new THREE.Fog(0x0a0f1d, 9, 22);
const camera = new THREE.PerspectiveCamera(65, 1, 0.05, 60);
const dolly = new THREE.Group(); dolly.add(camera); scene.add(dolly);
const START_Z = 1.9;
dolly.position.set(0, 0, 2.8);
let yaw = 0, pitch = -0.28;
camera.position.set(0, 1.6, 0);

scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x1a2238, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(2, 5, 3); scene.add(sun);
const lampTop = new THREE.PointLight(0x7fd0ff, 0.7, 6); lampTop.position.set(0, 2.2, 0.3); scene.add(lampTop);

const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, metalness: 0.05 }, o));
const lam = (c, o = {}) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o));

/* chão, marcação de segurança e blindagens */
const FLOOR_R = 5.6;
const floor = new THREE.Mesh(new THREE.CircleGeometry(FLOOR_R + 1, 64), lam(0x182034));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(FLOOR_R * 2, 28, 0x2f4a7a, 0x1d2a45); grid.position.y = 0.01; scene.add(grid);
const safety = new THREE.Mesh(new THREE.RingGeometry(1.08, 1.2, 64), new THREE.MeshBasicMaterial({ color: 0xffc233, transparent: true, opacity: 0.55, side: THREE.DoubleSide }));
safety.rotation.x = -Math.PI / 2; safety.position.y = 0.02; scene.add(safety);
[[-3.4,-3.6,2.4,3.2,1],[0,-4.2,3.6,3.6,1],[3.4,-3.6,2.4,3.2,1]].forEach(([x,z,w,h]) => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.9), std(0x6c7587)); b.position.set(x, h / 2, z); scene.add(b);
});
const roofLight = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.06, 0.5), new THREE.MeshBasicMaterial({ color: 0x9be0ff })); roofLight.position.set(0, 3.0, 0); scene.add(roofLight);

/* mesa de vidro com o lote */
const TABLE_Y = 0.86;
const table = new THREE.Group(); scene.add(table);
const glass = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.04, 0.85), new THREE.MeshStandardMaterial({ color: 0x9fd0ff, transparent: true, opacity: 0.28, roughness: 0.1, metalness: 0.2 }));
glass.position.y = TABLE_Y - 0.02; table.add(glass);
[[-0.58,-0.38],[0.58,-0.38],[-0.58,0.38],[0.58,0.38]].forEach(([x,z]) => {
  const l = new THREE.Mesh(new THREE.BoxGeometry(0.05, TABLE_Y - 0.04, 0.05), std(0x39445e)); l.position.set(x, (TABLE_Y - 0.04) / 2, z); table.add(l);
});

/* cabeças do acelerador (de cima e de baixo) */
function makeHead(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.17, 0.34, 24), std(0x54627f, { metalness: 0.4, roughness: 0.5 })); body.position.y = 0.2; g.add(body);
  const nozzle = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.12, 24, 1, true), std(0x9aa7c2, { metalness: 0.5, roughness: 0.4, side: THREE.DoubleSide })); nozzle.rotation.x = Math.PI; nozzle.position.y = 0.0; g.add(nozzle);
  const glow = new THREE.Mesh(new THREE.CircleGeometry(0.075, 24), new THREE.MeshBasicMaterial({ color: 0x4db8ff, transparent: true, opacity: 0.0 })); glow.rotation.x = Math.PI / 2; glow.position.y = -0.05; g.add(glow);
  g.userData.glow = glow;
  return g;
}
const headTop = makeHead(); scene.add(headTop);
const headBot = makeHead(); headBot.rotation.x = Math.PI; scene.add(headBot);
headBot.position.set(0, TABLE_Y - 0.07, 0);

/* lote de grãos (instâncias) */
const GS = 0.045, NX = 20, NZ = 12, MAXNY = 14;
const grainGeo = new THREE.IcosahedronGeometry(GS * 0.5, 0);
const grains = new THREE.InstancedMesh(grainGeo, lam(0xffffff), NX * NZ * MAXNY);
grains.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
grains.setColorAt(0, new THREE.Color(1, 1, 1));
grains.frustumCulled = false;
scene.add(grains);
let ny = 4, layerOf = new Uint8Array(NX * NZ * MAXNY), jitter = new Float32Array(NX * NZ * MAXNY);
(function(){ let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; for (let i = 0; i < jitter.length; i++) jitter[i] = 0.9 + r() * 0.16; })();
const layerD = new Float32Array(MAXNY);
const NEUTRAL = [0.78, 0.6, 0.3];
const frame = new THREE.Mesh(new THREE.BoxGeometry(NX * GS + 0.04, 1, NZ * GS + 0.04), new THREE.MeshBasicMaterial({ color: 0x9fd0ff, transparent: true, opacity: 0.1, depthWrite: false }));
scene.add(frame);

let HBLOCK = 0.2;
function buildBlock(){
  ny = Math.max(2, Math.min(MAXNY, Math.round(S.T * 0.05 / GS)));
  HBLOCK = ny * GS;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), sc = new THREE.Vector3();
  let n = 0, s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let j = 0; j < ny; j++) for (let iz = 0; iz < NZ; iz++) for (let ix = 0; ix < NX; ix++){
    v.set((ix + 0.5 - NX / 2) * GS + (r() - 0.5) * 0.004, TABLE_Y + (j + 0.5) * GS, (iz + 0.5 - NZ / 2) * GS + (r() - 0.5) * 0.004);
    e.set(r() * 3, r() * 3, r() * 3); q.setFromEuler(e); sc.set(1, 0.78 + r() * 0.12, 1.25 + r() * 0.2);
    m.compose(v, q, sc); grains.setMatrixAt(n, m); layerOf[n] = j; n++;
  }
  grains.count = n; grains.instanceMatrix.needsUpdate = true;
  frame.scale.y = HBLOCK; frame.position.y = TABLE_Y + HBLOCK / 2;
  headTop.position.set(0, TABLE_Y + HBLOCK + 0.36, 0);
}
const tmpC = new THREE.Color();
function paintBlock(p){
  // dose acumulada na animação = dose final × p
  for (let j = 0; j < ny; j++){
    const z = S.T * ((ny - 1 - j) + 0.5) / ny;
    layerD[j] = doseAt(z, S.T, S.E, S.sides, lvl().Ds);
  }
  const n = grains.count;
  for (let i = 0; i < n; i++){
    const j = layerOf[i], k = jitter[i];
    const c = pal(layerD[j] * p / (lvl().Ds * 2.0));
    const u = Math.min(1, p * 1.6);
    tmpC.setRGB((NEUTRAL[0] + (c[0] - NEUTRAL[0]) * u) * k, (NEUTRAL[1] + (c[1] - NEUTRAL[1]) * u) * k, (NEUTRAL[2] + (c[2] - NEUTRAL[2]) * u) * k);
    grains.setColorAt(i, tmpC);
  }
  grains.instanceColor.needsUpdate = true;
}

/* insetos (demonstração): um por camada, na face voltada para o jogador */
const bugs = [];
const bugGeo = new THREE.SphereGeometry(1, 10, 8);
for (let i = 0; i < MAXNY; i++){
  const mat = new THREE.MeshBasicMaterial({ color: 0xff4a3d });
  const m = new THREE.Mesh(bugGeo, mat); m.scale.set(0.014, 0.011, 0.024); scene.add(m);
  bugs.push({ m, mat, alive: true, layer: i, ph: i * 1.7 });
}
function placeBugs(){
  let s = 5; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  bugs.forEach((b, i) => {
    b.m.visible = i < ny; b.alive = true; b.mat.color.set(0xff4a3d); b.m.scale.set(0.014, 0.011, 0.024);
    b.x = (r() - 0.5) * (NX * GS - 0.12);
    b.y = TABLE_Y + (i + 0.5) * GS;
    b.m.position.set(b.x, b.y, NZ * GS / 2 + 0.012);
  });
}

/* feixes de partículas */
function makeBeam(){
  const N = 280, geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x7fd8ff, size: 0.026, transparent: true, opacity: 0.95, depthWrite: false }));
  pts.frustumCulled = false; pts.visible = false; scene.add(pts);
  const d = []; for (let i = 0; i < N; i++) d.push({ u: Math.random(), x: (Math.random() - 0.5) * 0.16, z: (Math.random() - 0.5) * 0.12, v: 0.9 + Math.random() * 0.8 });
  return { pts, d, N };
}
const beamTop = makeBeam(), beamBot = makeBeam();
function stepBeam(b, dt, y0, dir, reach){
  const a = b.pts.geometry.attributes.position.array;
  for (let i = 0; i < b.N; i++){
    const p = b.d[i]; p.u += dt * p.v; if (p.u > 1) p.u -= 1;
    a[i*3] = p.x * (1 + 4.6 * p.u); a[i*3+1] = y0 + dir * p.u * reach; a[i*3+2] = p.z * (1 + 3.4 * p.u);
  }
  b.pts.geometry.attributes.position.needsUpdate = true;
}

/* ============================================================
   PAINÉIS (canvas → textura) com botões acionáveis por raio
   ============================================================ */
const C = { bg: 'rgba(10,16,34,0.94)', line: 'rgba(120,160,230,0.35)', ink: '#eaf0ff', mut: '#9fb0d0', acc: '#4db8ff', ok: '#3fe08f', warn: '#ffb347', bad: '#ff6b5b' };
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function wrap(ctx, text, x, y, maxW, lh){
  const words = text.split(' '); let line = '', yy = y;
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line){ ctx.fillText(line, x, yy); line = w; yy += lh; } else line = t;
  }
  if (line){ ctx.fillText(line, x, yy); yy += lh; }
  return yy;
}
const panels = [];
function Panel(wm, hm, pw, ph, draw, pos, rotY){
  const cvs = document.createElement('canvas'); cvs.width = pw; cvs.height = ph;
  const ctx = cvs.getContext('2d');
  const tex = new THREE.CanvasTexture(cvs); tex.anisotropy = 4;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(wm, hm), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  mesh.position.set(pos[0], pos[1], pos[2]);
  if (rotY === 'face') mesh.lookAt(0, pos[1], START_Z); else mesh.rotation.y = rotY || 0;
  scene.add(mesh);
  const P = { mesh, rects: [], hover: -1, pw, ph, tex,
    redraw(){
      this.rects = [];
      ctx.clearRect(0, 0, pw, ph);
      const self = this;
      draw(ctx, function B(x, y, w, h, label, o, fn){
        const idx = self.rects.length; o = o || {};
        self.rects.push({ x, y, w, h, fn: o.disabled ? null : fn });
        const hov = self.hover === idx && !o.disabled;
        ctx.fillStyle = o.disabled ? 'rgba(60,70,95,0.55)' : (hov ? (o.hot || '#7fd0ff') : (o.on ? (o.col || C.acc) : 'rgba(40,58,98,0.95)'));
        rr(ctx, x, y, w, h, Math.min(18, h / 3)); ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = hov ? '#fff' : C.line; ctx.stroke();
        ctx.fillStyle = o.disabled ? '#6f7b96' : ((o.on || hov) ? '#04101f' : C.ink);
        ctx.font = (o.font || 'bold 34px') + ' system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(label, x + w / 2, y + h / 2 + 2);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      }, P);
      tex.needsUpdate = true;
    },
    hit(uv){
      const px = uv.x * pw, py = (1 - uv.y) * ph;
      for (let i = 0; i < this.rects.length; i++){ const r = this.rects[i]; if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return i; }
      return -1;
    }
  };
  mesh.userData.panel = P; panels.push(P);
  return P;
}
function card(ctx, pw, ph){
  ctx.fillStyle = C.bg; rr(ctx, 6, 6, pw - 12, ph - 12, 36); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = C.line; ctx.stroke();
}
function badge(ctx, x, y, text, col){
  ctx.font = 'bold 30px system-ui, sans-serif';
  const w = ctx.measureText(text).width + 36;
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; rr(ctx, x, y, w, 46, 23); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = col; ctx.textBaseline = 'middle'; ctx.fillText(text, x + 18, y + 24); ctx.textBaseline = 'alphabetic';
  return x + w + 12;
}

/* --- banner no alto --- */
const banner = Panel(1.9, 0.52, 1520, 416, (ctx) => {
  ctx.fillStyle = C.ink; ctx.font = 'bold 92px system-ui, sans-serif'; ctx.fillText('Laboratório de irradiação', 50, 118);
  ctx.fillStyle = C.mut; ctx.font = '40px system-ui, sans-serif';
  ctx.fillText('Regule o feixe e os lados: nenhum inseto pode sobreviver no lote.', 54, 186);
  let x = 50;
  x = badge(ctx, x, 222, 'alcance: referência NIST ESTAR', C.ok);
  badge(ctx, x, 222, 'curva de dose: ilustrativa', C.warn);
  badge(ctx, 50, 272, 'metas, doses e insetos: demonstração do jogo', C.warn);
  ctx.fillStyle = C.mut; ctx.font = '28px system-ui, sans-serif';
  ctx.fillText('Material educacional. Não substitui normas nem dosimetria.', 54, 366);
}, [0, 2.3, -0.5], 'face');

/* --- painel do operador --- */
const ctl = Panel(0.72, 0.9, 576, 720, (ctx, B) => {
  const L = lvl(), W = 576, st = stats(S.T, S.E, S.sides, L.Ds);
  card(ctx, W, 720);
  ctx.fillStyle = C.acc; ctx.font = 'bold 30px system-ui, sans-serif'; ctx.fillText('PAINEL DO OPERADOR', 36, 66);
  ctx.fillStyle = C.mut; ctx.font = 'bold 28px system-ui, sans-serif'; ctx.fillText('Energia do feixe', 36, 128);
  B(36, 146, 110, 96, '−', {}, () => setE(S.E - 1));
  B(430, 146, 110, 96, '+', {}, () => setE(S.E + 1));
  ctx.fillStyle = C.ink; ctx.font = 'bold 64px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(S.E + ' MeV', W / 2, 218); ctx.textAlign = 'left';
  const R = rangeCm(S.E), okR = R >= S.T * (S.sides === 2 ? 0.5 : 1);
  ctx.fillStyle = C.mut; ctx.font = '25px system-ui, sans-serif';
  ctx.fillText('Alcance no grão: ' + f1(R) + ' cm', 36, 270);
  ctx.fillStyle = C.warn; ctx.font = '21px system-ui, sans-serif';
  ctx.fillText('calculado: NIST ESTAR ÷ densidade suposta', 36, 298);
  ctx.fillStyle = C.mut; ctx.font = 'bold 28px system-ui, sans-serif'; ctx.fillText('Lados irradiados', 36, 352);
  B(36, 368, 240, 86, '1 lado', { on: S.sides === 1 }, () => setSides(1));
  B(300, 368, 240, 86, '2 lados', { on: S.sides === 2 }, () => setSides(2));
  if (L.free){
    ctx.fillStyle = C.mut; ctx.font = 'bold 28px system-ui, sans-serif'; ctx.fillText('Espessura do lote: ' + S.T + ' cm', 36, 502);
    B(36, 518, 110, 70, '−', {}, () => setT(S.T - 1));
    B(430, 518, 110, 70, '+', {}, () => setT(S.T + 1));
  } else {
    ctx.fillStyle = C.mut; ctx.font = '26px system-ui, sans-serif';
    ctx.fillText('Lote: ' + S.T + ' cm de grãos', 36, 508);
    ctx.fillStyle = okR ? C.ok : C.bad; ctx.font = 'bold 25px system-ui, sans-serif';
    ctx.fillText(okR ? 'O feixe chega ao fundo.' : 'O feixe não chega ao fundo!', 36, 546);
  }
  const busy = S.phase === 'running';
  B(36, 604, 360, 84, busy ? 'Irradiando…' : '▶ IRRADIAR', { on: !busy, col: C.ok, hot: '#7dffbf', disabled: busy, font: 'bold 38px' }, startRun);
  B(412, 604, 128, 84, '↺', { disabled: busy }, resetRun);
}, [-0.95, 1.3, 0.55], 'face');

/* --- placar --- */
const board = Panel(1.0, 0.98, 800, 784, (ctx, B) => {
  const L = lvl(), W = 800;
  card(ctx, W, 784);
  ctx.fillStyle = C.acc; ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.fillText(L.free ? 'MODO LIVRE' : 'FASE ' + (S.lvl + 1) + ' DE ' + (LEVELS.length - 1), 40, 66);
  ctx.fillStyle = C.ink; ctx.font = 'bold 50px system-ui, sans-serif'; ctx.fillText(L.nome, 40, 128);
  ctx.fillStyle = C.mut; ctx.font = '27px system-ui, sans-serif';
  let y = wrap(ctx, L.texto, 40, 176, 720, 36);
  if (!L.free){
    ctx.fillStyle = C.ink; ctx.font = 'bold 27px system-ui, sans-serif';
    ctx.fillText('Meta: todo grão ≥ ' + L.alvo + ' Gy e DUR ≤ ' + f1(L.durMax), 40, y + 10); y += 40;
  }
  ctx.fillStyle = C.mut; ctx.font = '23px system-ui, sans-serif';
  ctx.fillText('Dose na superfície, de cada lado: ' + L.Ds + ' Gy (valor do jogo)', 40, y + 8); y += 34;
  // legenda da cor
  const g = ctx.createLinearGradient(40, 0, 760, 0);
  STOPS.forEach(([t, c]) => g.addColorStop(t, 'rgb(' + c.join(',') + ')'));
  ctx.fillStyle = g; rr(ctx, 40, y + 4, 720, 22, 11); ctx.fill();
  ctx.fillStyle = C.mut; ctx.font = '21px system-ui, sans-serif';
  ctx.fillText('sem dose', 40, y + 52); ctx.textAlign = 'right'; ctx.fillText('muita dose', 760, y + 52); ctx.textAlign = 'left'; y += 84;

  const r = S.result;
  ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(40, y - 10); ctx.lineTo(760, y - 10); ctx.stroke();
  if (r){
    const cell = (x, lab, val, col) => { ctx.fillStyle = C.mut; ctx.font = '22px system-ui, sans-serif'; ctx.fillText(lab, x, y + 22); ctx.fillStyle = col; ctx.font = 'bold 42px system-ui, sans-serif'; ctx.fillText(val, x, y + 70); };
    const okMin = r.mn >= L.alvo;
    cell(40, 'Dmin', f1(r.mn) + ' Gy', L.free ? C.ink : (okMin ? C.ok : C.bad));
    cell(300, 'Dmax', f1(r.mx) + ' Gy', C.ink);
    cell(560, 'DUR', r.dur === null ? 'indef.' : f2(r.dur), (!L.free && r.dur !== null && r.dur > L.durMax) ? C.warn : C.ink);
    y += 128;
    ctx.fillStyle = C.ink; ctx.font = 'bold 27px system-ui, sans-serif';
    ctx.fillText('Insetos vivos: ' + r.vivos + ' de ' + ny + '   ·   Gasto: ' + (S.E * S.sides) + ' (MeV × lados)', 40, y);
    y += 20;
    if (!L.free){
      ctx.font = 'bold 60px system-ui, sans-serif';
      for (let i = 0; i < 3; i++){ ctx.fillStyle = i < S.stars ? '#ffd24a' : 'rgba(255,255,255,0.14)'; ctx.fillText('★', 40 + i * 70, y + 58); }
      ctx.fillStyle = S.stars >= 1 ? C.ok : C.bad; ctx.font = 'bold 27px system-ui, sans-serif';
      y = wrap(ctx, S.msg, 250, y + 20, 520, 33);
    } else {
      ctx.fillStyle = C.mut; ctx.font = '25px system-ui, sans-serif';
      wrap(ctx, S.msg, 40, y + 24, 720, 33);
    }
  } else {
    ctx.fillStyle = C.mut; ctx.font = '28px system-ui, sans-serif';
    wrap(ctx, 'Use o painel à esquerda e aperte IRRADIAR. Depois, olhe o lote de lado: a cor mostra a dose em cada camada.', 40, y + 24, 720, 38);
  }
  // navegação
  B(40, 686, 150, 70, '◀', { disabled: S.phase === 'running' || S.lvl === 0, font: 'bold 34px' }, () => setLevel(S.lvl - 1));
  B(210, 686, 380, 70, S.stars >= 1 && S.lvl < LEVELS.length - 2 ? 'Próxima fase ▶' : 'Fase seguinte ▶', { on: S.stars >= 1, disabled: S.phase === 'running' || S.lvl >= LEVELS.length - 1, font: 'bold 30px' }, () => setLevel(S.lvl + 1));
  B(610, 686, 150, 70, '↺', { disabled: S.phase === 'running' }, resetRun);
}, [0.95, 1.38, 0.2], 'face');

/* --- como jogar --- */
const how = Panel(0.8, 0.8, 640, 640, (ctx) => {
  card(ctx, 640, 640);
  ctx.fillStyle = C.acc; ctx.font = 'bold 30px system-ui, sans-serif'; ctx.fillText('COMO JOGAR', 36, 66);
  ctx.fillStyle = C.ink; ctx.font = '29px system-ui, sans-serif';
  let y = 124;
  ['1. Aponte o controle e aperte o gatilho nos botões.',
   '2. Aponte para o chão e aperte para andar.',
   '3. Joystick: gira para o lado.',
   '4. Escolha energia e lados, e aperte IRRADIAR.',
   '5. Olhe o lote de lado: roxo = pouca dose, amarelo = muita.',
   '6. Insetos vermelhos sobrevivem onde a dose é baixa.'].forEach(t => { y = wrap(ctx, t, 36, y, 570, 37) + 10; });
  ctx.fillStyle = C.mut; ctx.font = '23px system-ui, sans-serif';
  wrap(ctx, 'Dica: o elétron tem alcance limitado. O que fica além dele não recebe dose.', 36, y + 6, 570, 31);
}, [-2.0, 1.45, 0.15], 'face');

function redrawAll(){ panels.forEach(p => p.redraw()); }

/* ============================================================
   JOGO
   ============================================================ */
function setE(v){ if (S.phase === 'running') return; S.E = Math.max(1, Math.min(10, v)); clearResult(); sfx('tick'); }
function setSides(v){ if (S.phase === 'running') return; S.sides = v; clearResult(); sfx('tick'); }
function setT(v){ if (S.phase === 'running') return; S.T = Math.max(2, Math.min(12, v)); buildBlock(); placeBugs(); clearResult(); sfx('tick'); }
function clearResult(){ S.result = null; S.stars = -1; S.msg = ''; S.phase = 'ready'; S.p = 0; paintBlock(0); resetBugs(); redrawAll(); }
function resetRun(){ clearResult(); }
function resetBugs(){ bugs.forEach(b => { b.alive = true; b.mat.color.set(0xff4a3d); b.m.scale.set(0.014, 0.011, 0.024); }); }
function setLevel(i){
  if (S.phase === 'running') return;
  S.lvl = Math.max(0, Math.min(LEVELS.length - 1, i));
  S.T = lvl().T; S.E = 5; S.sides = 1;
  buildBlock(); placeBugs(); clearResult(); sfx('tick');
}
function startRun(){
  if (S.phase === 'running') return;
  resetBugs(); S.result = null; S.stars = -1; S.msg = '';
  S.phase = 'running'; S.p = 0; S.t0 = performance.now(); S.hum = sfx('hum'); redrawAll();
}
function finishRun(){
  const L = lvl(), st = stats(S.T, S.E, S.sides, L.Ds);
  const vivos = bugs.filter((b, i) => i < ny && b.alive).length;
  S.result = { mn: st.mn, mx: st.mx, dur: st.dur, vivos };
  if (L.free){
    S.stars = -1;
    S.msg = st.mn <= 1e-6 ? 'Há grãos sem nenhuma dose: o elétron não chega até eles.' : 'O ponto mais fraco recebeu ' + f1(st.mn) + ' Gy. É ele que decide o resultado.';
  } else {
    const ok1 = st.mn >= L.alvo, ok2 = ok1 && st.dur <= L.durMax, ok3 = ok2 && S.E * S.sides <= L.best;
    S.stars = ok3 ? 3 : ok2 ? 2 : ok1 ? 1 : 0;
    if (S.stars === 3) S.msg = 'Perfeito! Menor gasto de energia possível nesta fase.';
    else if (S.stars === 2) S.msg = 'Meta cumprida e dose uniforme. Dá para gastar menos energia?';
    else if (S.stars === 1) S.msg = 'Todos os grãos passaram da meta, mas a dose ficou desigual (DUR ' + f2(st.dur) + ' > ' + f1(L.durMax) + ').';
    else if (st.mn <= 1e-6) S.msg = 'Há grãos sem nenhuma dose: o feixe não chega ao fundo. Tente mais energia ou os dois lados.';
    else S.msg = 'O ponto mais fraco recebeu ' + f1(st.mn) + ' Gy, abaixo de ' + L.alvo + ' Gy. Os insetos ali sobrevivem.';
  }
  S.phase = 'done'; S.p = 1; paintBlock(1); redrawAll();
  sfx(S.stars >= 1 ? 'win' : (S.stars === 0 ? 'lose' : 'tick'));
  haptic(0.6, 120);
}

/* ============================================================
   SOM (Web Audio, criado depois do primeiro clique)
   ============================================================ */
let AC = null;
function audio(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e){} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type, vol, t0){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (t0 || 0);
  o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
function sfx(k){
  try {
    if (k === 'tick') tone(660, 0.07, 'square', 0.04);
    else if (k === 'hum'){ tone(110, DUR_RUN, 'sawtooth', 0.035); tone(220, DUR_RUN, 'sine', 0.03); }
    else if (k === 'win'){ [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.08, i * 0.11)); }
    else if (k === 'lose'){ tone(220, 0.25, 'sawtooth', 0.06); tone(165, 0.35, 'sawtooth', 0.06, 0.2); }
    else if (k === 'bug') tone(900 + Math.random() * 200, 0.05, 'square', 0.025);
  } catch (e){}
}
function haptic(v, ms){
  controllers.forEach(c => { try { const a = c.userData.gamepad && c.userData.gamepad.hapticActuators; if (a && a[0]) a[0].pulse(v, ms); } catch (e){} });
}

/* ============================================================
   ENTRADA: controles do Quest + mouse
   ============================================================ */
const controllers = [];
const ray = new THREE.Raycaster(); ray.far = 12;
const tpMarker = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.22, 32), new THREE.MeshBasicMaterial({ color: 0x4db8ff, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
tpMarker.rotation.x = -Math.PI / 2; tpMarker.visible = false; scene.add(tpMarker);
const hitFloorValid = p => Math.hypot(p.x, p.z) < FLOOR_R && !(Math.abs(p.x) < 0.75 && Math.abs(p.z) < 0.6);

function makeController(i){
  const c = renderer.xr.getController(i);
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 }));
  line.name = 'ray'; c.add(line);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.025, 0.12, 12), std(0x2b3550)); body.rotation.x = Math.PI / 2; body.position.z = 0.04; c.add(body);
  c.userData.hit = null;
  c.addEventListener('connected', e => { c.userData.gamepad = e.data && e.data.gamepad; c.userData.hand = e.data && e.data.handedness; });
  c.addEventListener('selectstart', () => onSelect(c.userData.hit));
  dolly.add(c); controllers.push(c);
}
makeController(0); makeController(1);

const targets = () => panels.map(p => p.mesh).concat([floor]);
function castFrom(origin, dir){
  ray.set(origin, dir);
  const h = ray.intersectObjects(targets(), false)[0];
  if (!h) return null;
  if (h.object === floor) return { kind: 'floor', point: h.point, dist: h.distance };
  const P = h.object.userData.panel, idx = P.hit(h.uv);
  return { kind: 'panel', P, idx, point: h.point, dist: h.distance };
}
function onSelect(h){
  audio();
  if (!h) return;
  if (h.kind === 'panel'){ if (h.idx >= 0){ const r = h.P.rects[h.idx]; if (r.fn){ r.fn(); haptic(0.3, 30); } } return; }
  if (h.kind === 'floor' && hitFloorValid(h.point)) teleportTo(h.point);
}
function headPos(){ return new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld); }
function teleportTo(p){
  camera.updateMatrixWorld(true);
  const hd = headPos();
  dolly.position.x += p.x - hd.x; dolly.position.z += p.z - hd.z;
  sfx('tick'); haptic(0.2, 25);
}
function snapTurn(a){
  camera.updateMatrixWorld(true); const b = headPos();
  dolly.rotation.y += a; dolly.updateMatrixWorld(true); camera.updateMatrixWorld(true);
  const c = headPos(); dolly.position.x += b.x - c.x; dolly.position.z += b.z - c.z;
}

/* mouse / toque (modo tela) */
const mouse = new THREE.Vector2(); let mouseHit = null, drag = null;
function ndc(e){ const r = cv.getBoundingClientRect(); mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); }
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  ndc(e);
  if (drag && (e.buttons & 1)){
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    if (drag.moved && !renderer.xr.isPresenting){ yaw -= dx * 0.004; pitch = Math.max(-1.2, Math.min(1.0, pitch - dy * 0.004)); drag.x = e.clientX; drag.y = e.clientY; }
  }
});
cv.addEventListener('pointerup', e => {
  ndc(e); const was = drag; drag = null;
  if (was && !was.moved && !renderer.xr.isPresenting){
    ray.setFromCamera(mouse, camera);
    const h = castFrom(ray.ray.origin.clone(), ray.ray.direction.clone());
    onSelect(h);
  }
});
cv.addEventListener('wheel', e => {
  if (renderer.xr.isPresenting) return;
  e.preventDefault();
  const d = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const np = dolly.position.clone().addScaledVector(d, -Math.sign(e.deltaY) * 0.35);
  if (Math.hypot(np.x, np.z) < FLOOR_R) dolly.position.copy(np);
}, { passive: false });

/* ============================================================
   VR
   ============================================================ */
const vrBtn = document.getElementById('vr');
let xrSession = null;
async function initVR(){
  if (!navigator.xr){ vrBtn.textContent = 'VR indisponível neste navegador'; return; }
  let ok = false;
  try { ok = await navigator.xr.isSessionSupported('immersive-vr'); } catch (e){}
  if (!ok){ vrBtn.textContent = 'VR indisponível: use o modo tela'; return; }
  vrBtn.disabled = false; vrBtn.textContent = 'Entrar em VR';
  vrBtn.onclick = async () => {
    audio();
    if (xrSession){ xrSession.end(); return; }
    try {
      const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] });
      xrSession = s;
      s.addEventListener('end', () => { xrSession = null; dolly.position.set(0, 0, 2.8); dolly.rotation.y = 0; vrBtn.textContent = 'Entrar em VR'; camera.position.set(0, 1.6, 0); document.getElementById('help').style.display = ''; });
      await renderer.xr.setSession(s);
      try { renderer.xr.setFoveation && renderer.xr.setFoveation(1); } catch (e){}
      dolly.position.set(0, 0, START_Z); dolly.rotation.y = 0;
      vrBtn.textContent = 'Sair do VR'; document.getElementById('help').style.display = 'none';
    } catch (err){ vrBtn.textContent = 'Não foi possível entrar em VR'; console.error(err); }
  };
}
initVR();

let turnCool = 0;
function pollSticks(dt){
  turnCool -= dt;
  const s = renderer.xr.getSession && renderer.xr.getSession();
  if (!s) return;
  for (const src of s.inputSources){
    const gp = src.gamepad; if (!gp || !gp.axes) continue;
    const x = gp.axes.length > 2 ? gp.axes[2] : gp.axes[0];
    if (Math.abs(x) > 0.7 && turnCool <= 0){ snapTurn(x > 0 ? -Math.PI / 6 : Math.PI / 6); turnCool = 0.3; }
  }
}

/* ============================================================
   LOOP
   ============================================================ */
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

const tmpO = new THREE.Vector3(), tmpD = new THREE.Vector3(), tmpM = new THREE.Matrix4();
let last = performance.now(), lastHoverKey = '';
function frame_(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const pres = renderer.xr.isPresenting;
  if (!pres){ camera.rotation.set(pitch, yaw, 0, 'YXZ'); }
  else pollSticks(dt);

  /* animação da irradiação */
  const L = lvl();
  const running = S.phase === 'running';
  if (running){
    S.p = Math.min(1, (now - S.t0) / 1000 / DUR_RUN);
    paintBlock(S.p);
    bugs.forEach((b, i) => {
      if (i >= ny || !b.alive) return;
      if (layerD[i] * S.p >= L.alvo){ b.alive = false; b.mat.color.set(0x7d828c); b.m.scale.set(0.014, 0.005, 0.024); sfx('bug'); }
    });
    if (S.p >= 1) finishRun();
  }
  const reachCm = Math.min(rangeCm(S.E), S.T), reach = reachCm / S.T * HBLOCK;
  beamTop.pts.visible = running; beamBot.pts.visible = running && S.sides === 2;
  if (running){
    stepBeam(beamTop, dt, TABLE_Y + HBLOCK + 0.12, -1, reach + 0.12);
    if (S.sides === 2) stepBeam(beamBot, dt, TABLE_Y - 0.02, +1, reach + 0.02);
  }
  headTop.userData.glow.material.opacity = running ? 0.9 : 0;
  headBot.userData.glow.material.opacity = running && S.sides === 2 ? 0.9 : 0;
  headBot.visible = S.sides === 2 || !running;
  bugs.forEach((b, i) => { if (i < ny && b.alive){ b.m.position.x = b.x + Math.sin(now / 400 + b.ph) * 0.012; b.m.rotation.y = Math.sin(now / 300 + b.ph) * 0.5; } });

  /* raios, hover e marcador de teleporte */
  const hovers = new Map(); let floorPt = null;
  const doCast = (o, d, line) => {
    const h = castFrom(o, d);
    if (line){ line.scale.z = h ? Math.max(0.1, h.dist) : 3; line.material.color.set(h && h.kind === 'panel' && h.idx >= 0 ? 0xffe066 : 0xffffff); }
    if (h && h.kind === 'panel' && h.idx >= 0) hovers.set(h.P, h.idx);
    if (h && h.kind === 'floor' && hitFloorValid(h.point)) floorPt = h.point;
    return h;
  };
  if (pres){
    controllers.forEach(c => {
      c.updateMatrixWorld(true);
      tmpM.identity().extractRotation(c.matrixWorld);
      tmpO.setFromMatrixPosition(c.matrixWorld); tmpD.set(0, 0, -1).applyMatrix4(tmpM);
      c.userData.hit = doCast(tmpO.clone(), tmpD.clone(), c.getObjectByName('ray'));
    });
  } else {
    ray.setFromCamera(mouse, camera);
    mouseHit = doCast(ray.ray.origin.clone(), ray.ray.direction.clone(), null);
  }
  const key = [...hovers].map(([p, i]) => panels.indexOf(p) + ':' + i).join(',');
  if (key !== lastHoverKey){
    lastHoverKey = key;
    panels.forEach(p => { const i = hovers.has(p) ? hovers.get(p) : -1; if (p.hover !== i){ p.hover = i; p.redraw(); } });
  }
  tpMarker.visible = !!floorPt;
  if (floorPt) tpMarker.position.set(floorPt.x, 0.03, floorPt.z);
  cv.style.cursor = hovers.size ? 'pointer' : (floorPt ? 'cell' : 'grab');

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame_);

/* início */
buildBlock(); placeBugs(); paintBlock(0); redrawAll();

/* ganchos para teste automático */
window.__lab = { S, LEVELS, stats, setE, setSides, setT, setLevel, startRun, resetRun, panels, get ny(){ return ny; }, get bugsAlive(){ return bugs.filter((b, i) => i < ny && b.alive).length; }, teleportTo, dolly };
})();
</script>
